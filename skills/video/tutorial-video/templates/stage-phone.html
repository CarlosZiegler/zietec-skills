<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tutorial stage</title>
<style>
/* One 1920×1080 background per scene: chapter and caption on the left, the phone's place on the
   right (the recording is laid over it by render.mjs), or a full title/end card. */
:root { --ink: #18181b; --muted: #6b6b76; --brand: #dd083b; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
body { background: radial-gradient(1100px 700px at 10% 0%, #f7f3f2, transparent 60%), linear-gradient(160deg, #eceef3, #e2e4ec); }
.logo { position: absolute; left: 140px; top: 90px; height: 44px; }
.panel { position: absolute; left: 140px; top: 260px; width: 860px; display: grid; gap: 34px; }
.chapter { justify-self: start; padding: 10px 20px; border-radius: 999px; background: #fff; border: 1px solid #e3e3e8; font-weight: 600; font-size: 24px; color: var(--muted); }
.chapter:empty { display: none; }
.caption { font-size: 46px; line-height: 1.25; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.rule { width: 80px; height: 5px; border-radius: 3px; background: var(--brand); }
.phone { position: absolute; left: 1196px; top: 50px; width: 456px; height: 980px; border-radius: 72px; background: #111; box-shadow: 0 40px 90px -40px rgba(20,20,40,.55); }
.card { position: absolute; inset: 0; display: none; place-items: center; background: linear-gradient(160deg, #1c1c21, #26262d); color: #fff; }
.card .in { display: grid; gap: 28px; justify-items: center; text-align: center; }
.card img { height: 64px; }
.card h1 { margin: 0; font-size: 80px; letter-spacing: -.02em; }
.card p { margin: 0; font-size: 32px; color: #c9c9d2; }
body.title .card.title, body.end .card.end { display: grid; }
</style>
</head>
<body>
<img class="logo" src="logo.svg" alt="">
<div class="panel"><div class="chapter" id="chapter"></div><div class="rule"></div><div class="caption" id="caption"></div></div>
<div class="phone"></div>
<div class="card title"><div class="in"><img src="logo-dark.svg" alt=""><h1 id="title"></h1><div class="rule"></div><p id="subtitle"></p></div></div>
<div class="card end"><div class="in"><img src="logo-dark.svg" alt=""><h1 id="endtitle"></h1><div class="rule"></div><p id="endsubtitle"></p></div></div>
<script>
	const q = new URLSearchParams(location.search);
	document.getElementById("chapter").textContent = q.get("chapter") || "";
	document.getElementById("caption").textContent = q.get("caption") || "";
	document.getElementById("title").textContent = q.get("title") || "";
	document.getElementById("subtitle").textContent = q.get("subtitle") || "";
	document.getElementById("endtitle").textContent = q.get("endTitle") || q.get("title") || "";
	document.getElementById("endsubtitle").textContent = q.get("endSubtitle") || "";
	if (q.get("brand")) document.documentElement.style.setProperty("--brand", q.get("brand"));
	if (q.get("mode")) document.body.classList.add(q.get("mode"));
</script>
</body>
</html>
